server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for maximum loading speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Basic Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Serve static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Control for static images and documents
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Cache Control for CSS and JS styles
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Cache Control for Audio files (streaming tracks support)
    location ~* \.(?:mp3|ogg|wav)$ {
        expires 14d;
        add_header Cache-Control "public, no-transform";
        add_header Accept-Ranges bytes;
        access_log off;
    }

    # Fallback to index on error
    error_page 404 /index.html;
}
